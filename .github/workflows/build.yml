name: Build AincradMods APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Run Build
        run: |
          chmod +x build.sh
          ./build.sh
        env:
          WORKSPACE: ${{ github.workspace }}

      - name: Upload Build Output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AincradMods_signed
          path: |
            AincradMods_signed.apk
            build/dex/
          if-no-files-found: warn
